<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WoofingPump DApp</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background:#0a0e17; color:#e0e6ed; min-height:100vh; min-height:100dvh; -webkit-tap-highlight-color:transparent; }
#app { max-width:480px; margin:0 auto; padding:12px; }

/* Header */
header { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #1e2a3a; margin-bottom:12px; }
.logo-area { display:flex; align-items:center; }
header h1 { font-size:1.2rem; color:#f0b90b; white-space:nowrap; }
#btn-connect { background:#f0b90b; color:#0a0e17; border:none; padding:8px 14px; border-radius:8px; font-weight:700; cursor:pointer; font-size:.8rem; white-space:nowrap; flex-shrink:0; }
#btn-connect:hover { background:#d4a30a; }
#wallet-info { font-size:.75rem; text-align:right; flex-shrink:0; }
#wallet-addr { display:block; color:#f0b90b; font-family:monospace; }
#wallet-chain { color:#6b7a8d; font-size:.7rem; }

/* Status */
#status-bar { min-height:22px; text-align:center; font-size:.8rem; margin-bottom:10px; }
.status-ok { color:#0ecb81; }
.status-err { color:#f6465d; }
.status-warn { color:#f0b90b; }

/* Panels */
.panel { background:#111827; border:1px solid #1e2a3a; border-radius:12px; padding:14px; margin-bottom:12px; }
h2 { font-size:.9rem; margin-bottom:10px; color:#8899aa; }

/* Info grid */
.info-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.info-item { background:#0d1321; padding:8px 10px; border-radius:8px; }
.info-label { font-size:.7rem; color:#6b7a8d; margin-bottom:1px; }
.info-value { font-size:.85rem; font-weight:600; word-break:break-all; }
.info-value.highlight { color:#f0b90b; }

/* Tabs */
.tabs { display:flex; gap:3px; margin-bottom:12px; }
.tab { flex:1; padding:9px 4px; background:#0d1321; border:1px solid #1e2a3a; border-radius:8px; color:#6b7a8d; cursor:pointer; font-size:.82rem; font-weight:600; transition:all .2s; text-align:center; }
.tab.active { background:#f0b90b; color:#0a0e17; border-color:#f0b90b; }
.tab-content { display:none; }
.tab-content.active { display:block; }

/* Form */
.form-group { margin-bottom:10px; }
.form-group label { display:block; font-size:.75rem; color:#6b7a8d; margin-bottom:3px; }
.form-group input { width:100%; padding:10px 12px; background:#0d1321; border:1px solid #1e2a3a; border-radius:8px; color:#e0e6ed; font-size:1rem; outline:none; -webkit-appearance:none; }
.form-group input:focus { border-color:#f0b90b; }
.form-hint { font-size:.7rem; color:#6b7a8d; margin-top:3px; }
.estimate-box { background:#0d1321; border:1px solid #1e2a3a; border-radius:8px; padding:8px 10px; margin-bottom:10px; font-size:.8rem; }
.estimate-box .row { display:flex; justify-content:space-between; margin-bottom:3px; }
.estimate-box .row:last-child { margin-bottom:0; }

/* Buttons */
.btn-action { width:100%; padding:12px; border:none; border-radius:8px; font-size:1rem; font-weight:700; cursor:pointer; transition:all .2s; -webkit-appearance:none; }
.btn-buy { background:#0ecb81; color:#fff; }
.btn-buy:hover { background:#0ba86a; }
.btn-sell { background:#f6465d; color:#fff; }
.btn-sell:hover { background:#d93a50; }
.btn-borrow { background:#1e90ff; color:#fff; }
.btn-borrow:hover { background:#1a7de0; }
.btn-repay { background:#a855f7; color:#fff; }
.btn-repay:hover { background:#9333ea; }
.btn-action:disabled { opacity:.5; cursor:not-allowed; }
.btn-max { background:#1e2a3a; border:none; color:#f0b90b; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:.72rem; margin-left:6px; flex-shrink:0; }
.input-row { display:flex; align-items:center; }
.input-row input { flex:1; min-width:0; }

/* Contract address */
.contract-addr { margin-top:8px; font-size:.7rem; color:#6b7a8d; word-break:break-all; }

/* Mobile */
@media (max-width:400px) {
  #app { padding:8px; }
  header h1 { font-size:1rem; }
  .tab { font-size:.75rem; padding:8px 2px; }
  .info-value { font-size:.78rem; }
  #btn-connect { padding:7px 10px; font-size:.75rem; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo-area">
      <h1>WoofingPump</h1>
    </div>
    <div id="wallet-area">
      <button id="btn-connect" onclick="connectWallet()">连接钱包</button>
      <div id="wallet-info" style="display:none">
        <span id="wallet-addr"></span>
        <span id="wallet-chain"></span>
      </div>
    </div>
  </header>

  <div id="status-bar"></div>

  <!-- Actions panel FIRST -->
  <div class="panel" id="actions-panel" style="display:none">
    <div class="tabs">
      <button class="tab active" data-tab="buy" onclick="switchTab('buy')">买入</button>
      <button class="tab" data-tab="sell" onclick="switchTab('sell')">卖出</button>
      <button class="tab" data-tab="borrow" onclick="switchTab('borrow')">借贷</button>
      <button class="tab" data-tab="repay" onclick="switchTab('repay')">偿还</button>
    </div>

    <div class="tab-content active" id="tab-buy">
      <div class="form-group">
        <label>支付 BNB 数量</label>
        <input type="number" id="buy-amount" placeholder="0.01" step="any" min="0" inputmode="decimal" oninput="estimateBuy()">
      </div>
      <div class="form-group">
        <label>滑点容差 (%)</label>
        <input type="number" id="buy-slippage" value="2" step="0.1" min="0.1" max="50" inputmode="decimal" oninput="updateBuyMin()">
      </div>
      <div class="estimate-box" id="buy-estimate" style="display:none">
        <div class="row"><span>预计获得代币</span><span id="buy-est-tokens">-</span></div>
        <div class="row"><span>最小获得（含滑点）</span><span id="buy-est-min">-</span></div>
        <div class="row"><span>平台手续费</span><span id="buy-est-pfee">-</span></div>
        <div class="row"><span>创建者分成</span><span id="buy-est-cfee">-</span></div>
      </div>
      <button class="btn-action btn-buy" onclick="doBuy()">买入</button>
    </div>

    <div class="tab-content" id="tab-sell">
      <div class="form-group">
        <label>卖出代币数量</label>
        <div class="input-row">
          <input type="number" id="sell-amount" placeholder="100" step="any" min="0" inputmode="decimal" oninput="estimateSell()">
          <button class="btn-max" onclick="fillMax('sell')">MAX</button>
        </div>
      </div>
      <div class="form-group">
        <label>滑点容差 (%)</label>
        <input type="number" id="sell-slippage" value="2" step="0.1" min="0.1" max="50" inputmode="decimal" oninput="updateSellMin()">
      </div>
      <div class="estimate-box" id="sell-estimate" style="display:none">
        <div class="row"><span>预计获得 BNB</span><span id="sell-est-bnb">-</span></div>
        <div class="row"><span>最小获得（含滑点）</span><span id="sell-est-min">-</span></div>
        <div class="row"><span>平台手续费</span><span id="sell-est-pfee">-</span></div>
        <div class="row"><span>创建者分成</span><span id="sell-est-cfee">-</span></div>
      </div>
      <button class="btn-action btn-sell" onclick="doSell()">卖出</button>
    </div>

    <div class="tab-content" id="tab-borrow">
      <div class="form-group">
        <label>抵押代币数量</label>
        <div class="input-row">
          <input type="number" id="borrow-amount" placeholder="100" step="any" min="0" inputmode="decimal" oninput="estimateBorrow()">
          <button class="btn-max" onclick="fillMax('borrow')">MAX</button>
        </div>
      </div>
      <div class="estimate-box" id="borrow-estimate" style="display:none">
        <div class="row"><span>可借 BNB（扣费前）</span><span id="borrow-est-gross">-</span></div>
        <div class="row"><span>借贷手续费 (3%)</span><span id="borrow-est-fee">-</span></div>
        <div class="row"><span>实际到账 BNB</span><span id="borrow-est-net">-</span></div>
      </div>
      <div class="form-hint" style="margin-bottom:10px;">抵押率 90%，借贷手续费 3%，按地板价计算</div>
      <button class="btn-action btn-borrow" onclick="doBorrow()">借贷</button>
    </div>

    <div class="tab-content" id="tab-repay">
      <div class="form-group">
        <label>偿还 BNB 数量</label>
        <div class="input-row">
          <input type="number" id="repay-amount" placeholder="0.01" step="any" min="0" inputmode="decimal">
          <button class="btn-max" onclick="fillMaxRepay()">全部还清</button>
        </div>
      </div>
      <div class="form-hint" style="margin-bottom:10px;">还清后自动解锁抵押代币，多余 BNB 会退回</div>
      <button class="btn-action btn-repay" onclick="doRepay()">偿还</button>
    </div>
  </div>

  <!-- User info -->
  <div class="panel" id="user-info-panel" style="display:none">
    <h2>我的账户</h2>
    <div class="info-grid">
      <div class="info-item"><div class="info-label">BNB 余额</div><div class="info-value highlight" id="u-bnb">-</div></div>
      <div class="info-item"><div class="info-label">代币余额</div><div class="info-value highlight" id="u-token">-</div></div>
      <div class="info-item"><div class="info-label">抵押代币</div><div class="info-value" id="u-collateral">-</div></div>
      <div class="info-item"><div class="info-label">待还 BNB</div><div class="info-value" id="u-debt">-</div></div>
    </div>
  </div>

  <!-- Token info -->
  <div class="panel" id="token-info-panel">
    <h2>代币信息</h2>
    <div id="token-loading">正在加载代币数据...</div>
    <div id="token-details" style="display:none">
      <div class="info-grid">
        <div class="info-item"><div class="info-label">名称</div><div class="info-value" id="tk-name">-</div></div>
        <div class="info-item"><div class="info-label">符号</div><div class="info-value" id="tk-symbol">-</div></div>
        <div class="info-item"><div class="info-label">当前价格</div><div class="info-value highlight" id="tk-price">-</div></div>
        <div class="info-item"><div class="info-label">地板价</div><div class="info-value" id="tk-floor">-</div></div>
        <div class="info-item"><div class="info-label">总供应量</div><div class="info-value" id="tk-supply">-</div></div>
        <div class="info-item"><div class="info-label">流通量</div><div class="info-value" id="tk-circ">-</div></div>
        <div class="info-item"><div class="info-label">池中 BNB</div><div class="info-value" id="tk-bnb">-</div></div>
        <div class="info-item"><div class="info-label">总借出 BNB</div><div class="info-value" id="tk-borrowed">-</div></div>
      </div>
      <div class="contract-addr">合约: <span id="tk-address">-</span></div>
    </div>
  </div>
</div>

<script>
const BSC_CHAIN_ID = '0x38';
const BSC_RPC = 'https://bsc-dataseed.binance.org/';
const FACTORY_PROXY = '0x5a1911c47f0819EB7E6cd0b5a9EB9db9a4322E1A';
const FIXED_TOKEN = '0xc17F8ef4e24410f00CbE365023d87273F95DdeFF';
const TOKEN_ABI = [
  'function name() view returns (string)',
  'function symbol() view returns (string)',
  'function decimals() view returns (uint8)',
  'function totalSupply() view returns (uint256)',
  'function circulatingSupply() view returns (uint256)',
  'function collateralSupply() view returns (uint256)',
  'function balanceOf(address) view returns (uint256)',
  'function floorPrice() view returns (uint256)',
  'function realBNB() view returns (uint256)',
  'function totalBorrowedBNB() view returns (uint256)',
  'function borrowedBNB(address) view returns (uint256)',
  'function collateralBalance(address) view returns (uint256)',
  'function getEffectivePrice() view returns (uint256)',
  'function estimateBuy(uint256) view returns (uint256 tokensOut, uint256 platformFee, uint256 creatorFee, uint256 reserveBoost)',
  'function estimateSell(uint256) view returns (uint256 bnbOut, uint256 platformFee, uint256 creatorFee, uint256 reserveBoost)',
  'function buy(uint256 minTokensOut) payable',
  'function sell(uint256 amount, uint256 minBnbOut)',
  'function borrow(uint256 amount)',
  'function repay() payable'
];

let provider, signer, userAddr;
let tokenContract, tokenAddress;
let readProvider, readToken;
let estimateTimer = null;
let lastBuyEstTokens = 0n;
let lastSellEstBnb = 0n;

function fmt(val, dec = 6) {
  const s = ethers.formatEther(val);
  const dot = s.indexOf('.');
  if (dot === -1) return s;
  return s.slice(0, dot + dec + 1);
}

function showStatus(msg, type = 'ok') {
  document.getElementById('status-bar').innerHTML = '<span class="status-' + type + '">' + msg + '</span>';
}

function clearStatus() { document.getElementById('status-bar').innerHTML = ''; }

async function ensureBSC() {
  const chainId = await window.ethereum.request({ method: 'eth_chainId' });
  if (chainId !== BSC_CHAIN_ID) {
    try {
      await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: BSC_CHAIN_ID }] });
    } catch (e) {
      if (e.code === 4902) {
        await window.ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [{
            chainId: BSC_CHAIN_ID, chainName: 'BNB Smart Chain',
            nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
            rpcUrls: [BSC_RPC], blockExplorerUrls: ['https://bscscan.com']
          }]
        });
      } else throw e;
    }
  }
}

async function connectWallet() {
  if (!window.ethereum) { showStatus('请安装 MetaMask 钱包', 'err'); return; }
  try {
    await ensureBSC();
    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    userAddr = await signer.getAddress();
    document.getElementById('btn-connect').style.display = 'none';
    document.getElementById('wallet-info').style.display = 'block';
    document.getElementById('wallet-addr').textContent = userAddr.slice(0,6) + '...' + userAddr.slice(-4);
    document.getElementById('wallet-chain').textContent = 'BSC Mainnet';
    showStatus('钱包已连接', 'ok');
    await loadToken();
    await loadUserInfo();
    document.getElementById('user-info-panel').style.display = 'block';
    document.getElementById('actions-panel').style.display = 'block';
  } catch (e) { showStatus('连接失败: ' + e.message, 'err'); }
}

async function loadToken() {
  try {
    if (!readProvider) readProvider = new ethers.JsonRpcProvider(BSC_RPC);
    tokenAddress = FIXED_TOKEN;
    readToken = new ethers.Contract(tokenAddress, TOKEN_ABI, readProvider);
    if (signer) tokenContract = new ethers.Contract(tokenAddress, TOKEN_ABI, signer);
    const [nm, sym, ts, cs, fp, rb, tb, ep] = await Promise.all([
      readToken.name(), readToken.symbol(), readToken.totalSupply(),
      readToken.circulatingSupply(), readToken.floorPrice(),
      readToken.realBNB(), readToken.totalBorrowedBNB(), readToken.getEffectivePrice()
    ]);
    document.getElementById('tk-name').textContent = nm;
    document.getElementById('tk-symbol').textContent = sym;
    document.getElementById('tk-price').textContent = fmt(ep) + ' BNB';
    document.getElementById('tk-floor').textContent = fmt(fp) + ' BNB';
    document.getElementById('tk-supply').textContent = fmt(ts, 2);
    document.getElementById('tk-circ').textContent = fmt(cs, 2);
    document.getElementById('tk-bnb').textContent = fmt(rb) + ' BNB';
    document.getElementById('tk-borrowed').textContent = fmt(tb) + ' BNB';
    document.getElementById('tk-address').textContent = tokenAddress;
    document.getElementById('token-loading').style.display = 'none';
    document.getElementById('token-details').style.display = 'block';
  } catch (e) { showStatus('加载代币失败: ' + e.message, 'err'); }
}

async function loadUserInfo() {
  if (!userAddr || !readToken) return;
  try {
    const [bnb, bal, coll, debt] = await Promise.all([
      readProvider.getBalance(userAddr),
      readToken.balanceOf(userAddr),
      readToken.collateralBalance(userAddr),
      readToken.borrowedBNB(userAddr)
    ]);
    document.getElementById('u-bnb').textContent = fmt(bnb) + ' BNB';
    document.getElementById('u-token').textContent = fmt(bal, 2);
    document.getElementById('u-collateral').textContent = fmt(coll, 2);
    document.getElementById('u-debt').textContent = fmt(debt) + ' BNB';
  } catch (e) { console.error('loadUserInfo', e); }
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.tab === name); });
  document.querySelectorAll('.tab-content').forEach(function(c){ c.classList.toggle('active', c.id === 'tab-' + name); });
}

function applySlippage(amount, slippagePct) {
  var bps = Math.floor(parseFloat(slippagePct) * 100);
  if (bps <= 0 || bps >= 10000) bps = 200;
  return amount * BigInt(10000 - bps) / 10000n;
}

function updateBuyMin() {
  if (lastBuyEstTokens === 0n) return;
  var slip = document.getElementById('buy-slippage').value || '2';
  var minOut = applySlippage(lastBuyEstTokens, slip);
  document.getElementById('buy-est-min').textContent = fmt(minOut, 4);
}

function updateSellMin() {
  if (lastSellEstBnb === 0n) return;
  var slip = document.getElementById('sell-slippage').value || '2';
  var minOut = applySlippage(lastSellEstBnb, slip);
  document.getElementById('sell-est-min').textContent = fmt(minOut) + ' BNB';
}

async function estimateBuy() {
  clearTimeout(estimateTimer);
  estimateTimer = setTimeout(async function(){
    var val = document.getElementById('buy-amount').value;
    var box = document.getElementById('buy-estimate');
    if (!val || parseFloat(val) <= 0) { box.style.display = 'none'; return; }
    try {
      var wei = ethers.parseEther(val);
      var est = await readToken.estimateBuy(wei);
      lastBuyEstTokens = est.tokensOut;
      document.getElementById('buy-est-tokens').textContent = fmt(est.tokensOut, 4);
      document.getElementById('buy-est-pfee').textContent = fmt(est.platformFee) + ' BNB';
      document.getElementById('buy-est-cfee').textContent = fmt(est.creatorFee) + ' BNB';
      updateBuyMin();
      box.style.display = 'block';
    } catch (e) { box.style.display = 'none'; lastBuyEstTokens = 0n; }
  }, 300);
}

async function estimateSell() {
  clearTimeout(estimateTimer);
  estimateTimer = setTimeout(async function(){
    var val = document.getElementById('sell-amount').value;
    var box = document.getElementById('sell-estimate');
    if (!val || parseFloat(val) <= 0) { box.style.display = 'none'; return; }
    try {
      var amt = ethers.parseEther(val);
      var est = await readToken.estimateSell(amt);
      lastSellEstBnb = est.bnbOut;
      document.getElementById('sell-est-bnb').textContent = fmt(est.bnbOut) + ' BNB';
      document.getElementById('sell-est-pfee').textContent = fmt(est.platformFee) + ' BNB';
      document.getElementById('sell-est-cfee').textContent = fmt(est.creatorFee) + ' BNB';
      updateSellMin();
      box.style.display = 'block';
    } catch (e) { box.style.display = 'none'; lastSellEstBnb = 0n; }
  }, 300);
}

async function estimateBorrow() {
  clearTimeout(estimateTimer);
  estimateTimer = setTimeout(async function(){
    var val = document.getElementById('borrow-amount').value;
    var box = document.getElementById('borrow-estimate');
    if (!val || parseFloat(val) <= 0) { box.style.display = 'none'; return; }
    try {
      var amt = ethers.parseEther(val);
      var fp = await readToken.floorPrice();
      var gross = amt * fp * 9000n / (10n ** 18n * 10000n);
      var fee = gross * 300n / 10000n;
      var net = gross - fee;
      document.getElementById('borrow-est-gross').textContent = fmt(gross) + ' BNB';
      document.getElementById('borrow-est-fee').textContent = fmt(fee) + ' BNB';
      document.getElementById('borrow-est-net').textContent = fmt(net) + ' BNB';
      box.style.display = 'block';
    } catch (e) { box.style.display = 'none'; }
  }, 300);
}

async function fillMax(type) {
  if (!userAddr || !readToken) return;
  var bal = await readToken.balanceOf(userAddr);
  document.getElementById(type + '-amount').value = ethers.formatEther(bal);
  if (type === 'sell') estimateSell();
  if (type === 'borrow') estimateBorrow();
}

async function fillMaxRepay() {
  if (!userAddr || !readToken) return;
  var debt = await readToken.borrowedBNB(userAddr);
  document.getElementById('repay-amount').value = ethers.formatEther(debt);
}

async function doBuy() {
  if (!tokenContract) { showStatus('请先连接钱包', 'err'); return; }
  var val = document.getElementById('buy-amount').value;
  if (!val || parseFloat(val) <= 0) { showStatus('请输入 BNB 数量', 'err'); return; }
  var slip = document.getElementById('buy-slippage').value || '2';
  var minTokens = lastBuyEstTokens > 0n ? applySlippage(lastBuyEstTokens, slip) : 0n;
  try {
    showStatus('交易发送中...', 'warn');
    var tx = await tokenContract.buy(minTokens, { value: ethers.parseEther(val) });
    showStatus('等待确认... TX: ' + tx.hash.slice(0,10) + '...', 'warn');
    await tx.wait();
    showStatus('买入成功!', 'ok');
    await refresh();
  } catch (e) { showStatus('买入失败: ' + (e.reason || e.message), 'err'); }
}

async function doSell() {
  if (!tokenContract) { showStatus('请先连接钱包', 'err'); return; }
  var val = document.getElementById('sell-amount').value;
  if (!val || parseFloat(val) <= 0) { showStatus('请输入代币数量', 'err'); return; }
  var slip = document.getElementById('sell-slippage').value || '2';
  var minBnb = lastSellEstBnb > 0n ? applySlippage(lastSellEstBnb, slip) : 0n;
  try {
    showStatus('交易发送中...', 'warn');
    var tx = await tokenContract.sell(ethers.parseEther(val), minBnb);
    showStatus('等待确认... TX: ' + tx.hash.slice(0,10) + '...', 'warn');
    await tx.wait();
    showStatus('卖出成功!', 'ok');
    await refresh();
  } catch (e) { showStatus('卖出失败: ' + (e.reason || e.message), 'err'); }
}

async function doBorrow() {
  if (!tokenContract) { showStatus('请先连接钱包', 'err'); return; }
  var val = document.getElementById('borrow-amount').value;
  if (!val || parseFloat(val) <= 0) { showStatus('请输入抵押代币数量', 'err'); return; }
  try {
    showStatus('交易发送中...', 'warn');
    var tx = await tokenContract.borrow(ethers.parseEther(val));
    showStatus('等待确认... TX: ' + tx.hash.slice(0,10) + '...', 'warn');
    await tx.wait();
    showStatus('借贷成功!', 'ok');
    await refresh();
  } catch (e) { showStatus('借贷失败: ' + (e.reason || e.message), 'err'); }
}

async function doRepay() {
  if (!tokenContract) { showStatus('请先连接钱包', 'err'); return; }
  var val = document.getElementById('repay-amount').value;
  if (!val || parseFloat(val) <= 0) { showStatus('请输入偿还 BNB 数量', 'err'); return; }
  try {
    showStatus('交易发送中...', 'warn');
    var tx = await tokenContract.repay({ value: ethers.parseEther(val) });
    showStatus('等待确认... TX: ' + tx.hash.slice(0,10) + '...', 'warn');
    await tx.wait();
    showStatus('偿还成功!', 'ok');
    await refresh();
  } catch (e) { showStatus('偿还失败: ' + (e.reason || e.message), 'err'); }
}

async function refresh() {
  await Promise.all([loadToken(), loadUserInfo()]);
}
